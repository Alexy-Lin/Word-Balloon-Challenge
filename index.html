<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>单词气球网页版</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 全局渐变定义（始终渲染，供所有 Bugatti SVG 引用） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <linearGradient id="traceBodyBlue" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#71d7ff" /><stop offset="34%" stop-color="#36b5f3" />
          <stop offset="67%" stop-color="#208fe0" /><stop offset="100%" stop-color="#1a77cc" />
        </linearGradient>
        <linearGradient id="traceBodyShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.5)" /><stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </linearGradient>
        <linearGradient id="traceGlass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#dbf3ff" stop-opacity="0.95" /><stop offset="45%" stop-color="#8cbfe1" stop-opacity="0.85" /><stop offset="100%" stop-color="#2b4665" stop-opacity="0.94" />
        </linearGradient>
        <linearGradient id="traceDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a293b" /><stop offset="100%" stop-color="#0c1520" />
        </linearGradient>
        <radialGradient id="traceTire" cx="50%" cy="50%" r="50%">
          <stop offset="58%" stop-color="#1f252d" /><stop offset="100%" stop-color="#080c12" />
        </radialGradient>
        <radialGradient id="traceShadow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(0,0,0,0.34)" /><stop offset="100%" stop-color="rgba(0,0,0,0)" />
        </radialGradient>
      </defs>
    </svg>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>
    <div class="bg-shape bg-shape-c"></div>

    <main class="app-shell">
      <header class="topbar card">
        <div class="topbar-brand">
          <h1>单词气球挑战</h1>
          <p class="subtitle">快乐背单词，打气球，拿星星</p>
        </div>
        <div class="topbar-actions">
          <span class="stat-pill sync-pill">同步: <span id="syncState">未同步</span></span>
          <div class="topbar-group">
            <button id="soundBtn" class="btn ghost sm">音效: 开</button>
            <button id="speechBtn" class="btn ghost sm">读音: 开</button>
          </div>
          <div class="topbar-group">
            <button id="importBtn" class="btn ghost sm">导入 CSV</button>
            <button id="exportBtn" class="btn ghost sm">导出 CSV</button>
            <input id="fileInput" type="file" accept=".csv" hidden />
          </div>
          <button id="backBtn" class="btn warn">返回选单</button>
        </div>
      </header>

      <section id="unitScreen" class="card">
        <div class="unit-screen-head">
          <h2>选择学习单元</h2>
          <div class="manage-actions">
            <button id="openMarketBtn" class="btn ghost">市场</button>
            <button id="openAdminBtn" class="btn ghost">单元管理</button>
          </div>
        </div>
        <div class="home-stats">
          <div class="home-stats-row">
            <div class="home-stat-coin">
              <span class="home-stat-icon">🪙</span>
              <span class="home-stat-label">银币</span>
              <span class="home-stat-value" id="homeSilverCoins">0</span>
            </div>
            <div class="home-stat-coin gold">
              <span class="home-stat-icon">👑</span>
              <span class="home-stat-label">金币</span>
              <span class="home-stat-value" id="homeGoldCoins">0</span>
            </div>
            <div class="home-stat-coin">
              <span class="home-stat-icon">📚</span>
              <span class="home-stat-label">总单词</span>
              <span class="home-stat-value" id="homeTotalWords">0</span>
            </div>
          </div>
          <div class="home-stages">
            <div class="home-stage" data-stage="0">
              <span class="stage-dot s0"></span>
              <span class="stage-name">英文气球</span>
              <span class="stage-num" id="homeStage0">0</span>
            </div>
            <div class="home-stage" data-stage="1">
              <span class="stage-dot s1"></span>
              <span class="stage-name">中文气球</span>
              <span class="stage-num" id="homeStage1">0</span>
            </div>
            <div class="home-stage" data-stage="2">
              <span class="stage-dot s2"></span>
              <span class="stage-name">简单拼写</span>
              <span class="stage-num" id="homeStage2">0</span>
            </div>
            <div class="home-stage" data-stage="3">
              <span class="stage-dot s3"></span>
              <span class="stage-name">普通拼写</span>
              <span class="stage-num" id="homeStage3">0</span>
            </div>
            <div class="home-stage" data-stage="4">
              <span class="stage-dot s4"></span>
              <span class="stage-name">已完成</span>
              <span class="stage-num" id="homeStage4">0</span>
            </div>
          </div>
        </div>
        <div id="unitList" class="unit-list"></div>
      </section>

      <section id="marketScreen" class="card hidden">
        <div class="manage-head">
          <h2>车辆与特效市场</h2>
          <div class="manage-actions">
            <button id="marketBackBtn" class="btn ghost">返回主页</button>
          </div>
        </div>
        <p class="manage-summary">银币: <span id="marketWalletSilver">0</span> | 金币: <span id="marketWalletGold">0</span></p>
        <div id="marketList" class="market-list"></div>
      </section>

      <section id="adminScreen" class="card hidden">
        <div class="manage-head">
          <h2>单元与单词管理</h2>
          <div class="manage-actions">
            <button id="adminBackBtn" class="btn ghost">返回主页</button>
          </div>
        </div>

        <div class="admin-grid">
          <div class="admin-pane">
            <h3>单元列表</h3>
            <div class="inline-form">
              <input id="newUnitInput" class="text-input" placeholder="输入新单元名" />
              <button id="addUnitBtn" class="btn warn">新增单元</button>
            </div>
            <div id="adminUnitList" class="admin-unit-list"></div>
          </div>

          <div class="admin-pane">
            <h3 id="adminWordTitle">单词管理</h3>
            <div class="inline-form">
              <input id="newWordCnInput" class="text-input" placeholder="中文" />
              <input id="newWordEnInput" class="text-input" placeholder="英文" />
              <button id="addWordBtn" class="btn warn">新增单词</button>
            </div>
            <div class="inline-form">
              <select id="batchStatusSelect" class="text-input" aria-label="批量设置模式">
                <option value="0">进度0（英文气球）</option>
                <option value="1">进度1（中文气球）</option>
                <option value="2">进度2（简单拼写）</option>
                <option value="3">进度3（普通拼写）</option>
                <option value="4">进度4（完成）</option>
              </select>
              <button id="batchSetStatusBtn" class="btn ghost">一键设置本单元全部模式</button>
            </div>
            <div id="adminWordList" class="admin-word-list"></div>
          </div>
        </div>
      </section>

      <section id="manageScreen" class="card hidden">
        <div class="manage-head">
          <h2 id="manageTitle">单元管理</h2>
          <div class="manage-actions">
            <button id="manageBackBtn" class="btn ghost">返回选单</button>
            <button id="startLearnBtn" class="btn warn">开始学习</button>
            <button id="startReviewBtn" class="btn ghost" disabled>进入复习模式</button>
          </div>
        </div>
        <p id="manageSummary" class="manage-summary">-</p>
        <p id="reviewCountText" class="manage-summary">复习模式完成次数: 0</p>
        <div id="manageWordList" class="manage-word-list"></div>
      </section>

      <section id="gameScreen" class="card hidden">
        <span id="modeLabel" hidden></span>

        <div class="canvas-wrapper">
          <!-- 左上角：本局分数 + 银币 + 金币 -->
          <div class="canvas-overlay canvas-tl">
            <div class="stat-pill">本局: <span id="sessionScore">0</span></div>
            <div class="stat-pill">累计银币: <span id="totalScore">0</span></div>
            <div class="stat-pill">金币: <span id="goldCoins">0</span></div>
          </div>

          <!-- 右上角：4 模式进度 -->
          <div class="canvas-overlay canvas-tr">
            <div class="progress-pill">英文: <span id="progressEn">0/0</span></div>
            <div class="progress-pill">中文: <span id="progressCn">0/0</span></div>
            <div class="progress-pill">简单: <span id="progressSimple">0/0</span></div>
            <div class="progress-pill">普通: <span id="progressNormal">0/0</span></div>
          </div>

          <!-- 上方中央：题目 -->
          <div class="canvas-overlay canvas-tc">
            <h3 id="promptText">-</h3>
          </div>

          <!-- 下方中央：答对提示 -->
          <div class="canvas-overlay canvas-bc">
            <p id="feedback" class="feedback"></p>
          </div>

          <canvas id="balloonCanvas" width="1100" height="560"></canvas>

          <div id="roadScene" class="road-scene challenge-barrier hidden">
            <div class="scene-sky"></div>
            <div class="scene-hills"></div>
            <div class="scene-label" id="spellingChallengeLabel">前方路障，拼对单词冲过去</div>
            <div class="road-lane lane-a"></div>
            <div class="road-lane lane-b"></div>
            <div class="road-gap" id="roadGap"></div>
            <div class="road-water" id="roadWater"></div>
            <div class="road-car" id="roadCar">
